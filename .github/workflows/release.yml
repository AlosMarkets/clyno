name: Release

# Publishes to npm whenever you push a version tag, e.g. v0.1.1.
# Authentication uses npm Trusted Publishing (OIDC) — no token is stored
# anywhere. You must link this repo as a trusted publisher on npmjs.com first
# (see the "Publishing" section of CONTRIBUTING / the repo README).

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1; the bundled npm may be older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs clean + build + test, so a broken build never ships.
      - name: Publish to npm
        run: npm publish --access public --provenance
